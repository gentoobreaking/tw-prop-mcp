events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Health check endpoint for liveness/readiness probes
        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Proxy MCP API requests to the backend container (avoids CORS
        # by keeping the browser on the same origin).
        # MCP-over-HTTP uses SSE-style streaming; nginx must preserve
        # request method, body, and forward all MCP-relevant headers.
        location /mcp {
            proxy_pass http://tw-prop-mcp:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Encoding $http_accept_encoding;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Origin $http_origin;
            proxy_cache off;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Proxy NLSC cadastral tiles (bypass browser CORS)
        location /proxy/nlsc/ {
            proxy_pass https://maps.nlsc.gov.tw/SMCSHORT/;
            proxy_http_version 1.1;
            proxy_set_header Host maps.nlsc.gov.tw;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
            proxy_buffering on;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
