apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: tw-prop-mcp
  labels:
    app.kubernetes.io/name: tw-prop-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/version: "v2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
        app.kubernetes.io/name: tw-prop-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/version: "v2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Run as non-root for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: mcp-server
          image: ghcr.io/tw-prop-mcp/server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mcp-server-config
            - secretRef:
                name: mcp-server-secret
          env:
            # Database connection — assembled from ConfigMap (non-secret) + Secret (credentials)
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-server-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-server-secret
                  key: POSTGRES_PASSWORD
            - name: DB_SSLMODE
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: DB_SSLMODE
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-server-secret
                  key: GOOGLE_MAPS_API_KEY
            - name: MCP_HTTP_ADDR
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: MCP_HTTP_ADDR
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: mcp-server-config
                  key: OTEL_SERVICE_NAME
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data-import
              mountPath: /tmp/mcp-data-import
      # Ephemeral volume for raw downloads and temp files during data import
      volumes:
        - name: data-import
          emptyDir:
            sizeLimit: "2Gi"
