apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-secret
  namespace: tw-prop-mcp
  labels:
    app.kubernetes.io/name: tw-prop-mcp
    app.kubernetes.io/component: mcp-server
type: Opaque
data:
  # PostgreSQL credentials — replace with real values before production use.
  # echo -n 'mcp-server' | base64  =>  bWMtc2VydmVy
  POSTGRES_USER: bWMtc2VydmVy
  # echo -n 'replace-with-real-db-password' | base64
  POSTGRES_PASSWORD: cmVwbGFjZS13aXRoLXJlYWwtZGItcGFzc3dvcmQ=

  # PostgreSQL super-user for init-job / migration tasks
  POSTGRES_SUPERUSER: cG9zdGdyZXM=
  POSTGRES_SUPERUSER_PASSWORD: cmVwbGFjZS13aXRoLXJlYWwtc3VwZXItcGFzc3dvcmQ=

  # Google Maps API key for frontend map rendering (not used by MCP server).
  # echo -n 'YOUR_GOOGLE_MAPS_API_KEY' | base64
  GOOGLE_MAPS_API_KEY: WU9VUl9HT09HTEVfTUFQU19BUElfS0VZ

  # MOI data download URL — placeholder.
  # echo -n 'https://lvr.land.moi.gov.tw/LVRD/LVRD.do' | base64
  MOI_DATA_DOWNLOAD_URL: aHR0cHM6Ly9sdnIubGFuZC5tb2kuZ292LnR3L0xWUkQvTFZSRC5kbw==
