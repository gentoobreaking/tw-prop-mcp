# Frontend — React + TypeScript + Google Maps
# The frontend renders maps, parcels, transactions, and valuation results.
# It does NOT perform any computation; it calls the MCP server's HTTP API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tw-prop-mcp
  labels:
    app.kubernetes.io/name: tw-prop-mcp
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "v2.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: tw-prop-mcp
        app.kubernetes.io/component: frontend
        app.kubernetes.io/version: "v2.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: frontend
          image: ghcr.io/tw-prop-mcp/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            # The MCP server internal endpoint (ClusterIP)
            - name: MCP_API_URL
              value: "http://mcp-server.tw-prop-mcp.svc.cluster.local:8080"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: mcp-server-secret
              # Only GOOGLE_MAPS_API_KEY is consumed by the frontend
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
