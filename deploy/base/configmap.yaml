apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-config
  namespace: tw-prop-mcp
  labels:
    app.kubernetes.io/name: tw-prop-mcp
    app.kubernetes.io/component: mcp-server
data:
  # Database connection
  DATABASE_URL: "postgresql://mcp-server:$(POSTGRES_PASSWORD)@postgres.tw-prop-mcp.svc.cluster.local:5432/prop"
  DB_HOST: "postgres.tw-prop-mcp.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "prop"
  DB_USER: "mcp-server"
  DB_SSLMODE: "require"

  # MCP Server runtime
  MCP_SERVER_NAME: "tw-prop-mcp"
  MCP_SERVER_VERSION: "v2.0.0"
  MCP_HTTP_ADDR: ":8080"
  MCP_REQUEST_ID_HEADER: "X-Request-ID"
  MCP_TRANSPORT: "http"

  # Valuation configuration
  VALUATION_CONFIG_VERSION: "v2.0"
  ALGORITHM_VERSION: "comparable-v2.0"
  CONFIGURATION_VERSION: "v2.0"

  # Snapshot settings
  DEFAULT_SNAPSHOT_SOURCE: "MOI"
  DEFAULT_SNAPSHOT_VERSION: "latest"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Metrics / Observability
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.tw-prop-mcp.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "tw-prop-mcp-mcp-server"

  # Data source configuration (MOI official real-price registration)
  DATA_SOURCE_NAME: "MOI"
  # The MOI real-price registration data is published quarterly as CSV archives.
  # This URL should be overridden via Secret or environment for production.
  MOI_DATA_BASE_URL: "https://lvr.land.moi.gov.tw"
  DOWNLOAD_DEST: "/tmp/mcp-data-import"

  # GIS configuration
  GIS_SRID_INTERNAL: "3826"
  GIS_SRID_EXTERNAL: "4326"
  NLSC_WFS_BASE_URL: "https://maps.land.gov.tw/swgc/"
  LAND_REGISTRY_API_BASE_URL: "https://lvr.land.moi.gov.tw"
